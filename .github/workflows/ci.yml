name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check backend
        run: ./gradlew --no-daemon :backend:check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Test web
        working-directory: web
        run: npm test
      - name: Build web
        working-directory: web
        run: npm run build

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Check generated bindings and TypeScript
        run: npm run types:check && npm run check
      - name: Build deployment assets
        run: npm run build
      - name: Test Worker
        run: npm test

  container:
    runs-on: ubuntu-latest
    needs:
      - backend
      - web
      - cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: review-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test standard and headless modes
        run: bash scripts/container-smoke.sh review-engine:ci
