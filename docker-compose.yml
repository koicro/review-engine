name: review-engine

services:
  review-engine:
    build:
      context: .
    image: review-engine:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REVIEW_HTTP_PORT:-8080}:8080"
    environment:
      REVIEW_HTTP_HOST: 0.0.0.0
      REVIEW_HTTP_PORT: 8080
      REVIEW_DATABASE_PATH: /data/review-engine.db
      REVIEW_UI_ENABLED: "${REVIEW_UI_ENABLED:-true}"
      REVIEW_ADMIN_TOKEN: "${REVIEW_ADMIN_TOKEN:?Set REVIEW_ADMIN_TOKEN to a secret of at least 16 characters}"
      REVIEW_PUBLIC_ORIGIN: "${REVIEW_PUBLIC_ORIGIN:-}"
    volumes:
      - review-engine-data:/data
    read_only: true
    tmpfs:
      # sqlite-jdbc extracts and loads its architecture-specific native library here.
      - /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  review-engine-data:
